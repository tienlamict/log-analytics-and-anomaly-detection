kafka:
  brokers:
    - "kafka:29092"
  topic: "application-logs"
  group_id: "log-analytics"
  initial_offset: "oldest"

metrics:
  port: 2112

log:
  level: "info"

detection:
  window_duration: "5m"
  eviction_interval: "30s"
  cooldown_duration: "15m"
  warmup_multiplier: 2
  rules:
    error_rate:
      enabled: true
      threshold: 10
      window: "5m"
      severity: "high"
    latency:
      enabled: true
      threshold_ms: 500
      breach_rate_percent: 20
      window: "5m"
      severity: "medium"
    repeated_failure:
      enabled: true
      threshold: 5
      window: "5m"
      severity: "medium"
    auth_burst:
      enabled: true
      threshold: 10
      window: "5m"
      ip_field: "source_ip"
      user_field: "username"
      severity: "high"
    off_hours:
      enabled: true
      business_hours_start: 9
      business_hours_end: 17
      timezone: "UTC"
      sensitive_paths:
        - "/admin"
        - "/api/v1/users"
        - "/internal"
      severity: "medium"
    service_silence:
      enabled: true
      silence_after: "5m"
      check_interval: "30s"
      min_log_count: 5
      severity: "critical"

elasticsearch:
  addresses:
    - "http://elasticsearch:9200"
  username: ""
  password: ""
  max_idle_conns: 50
  response_timeout: "15s"

smtp:
  host: "mailhog"
  port: 1025
  username: ""
  password: ""
  from: "alerts@log-analytics.local"
  recipients:
    - "ops@example.com"
  tls_policy: "none"
